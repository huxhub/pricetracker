# ==============================================================================
# Nginx Configuration for Price Tracker API
# Subdomain: pricetrackerapi.uxhub.in -> Proxies to Express API (Port 5050)
# (Frontend pricetracker.uxhub.in is hosted on Vercel)
#
# Save to: /etc/nginx/sites-available/pricetrackerapi.conf
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name pricetrackerapi.uxhub.in;

    client_max_body_size 25M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
